x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  validator-api-db:
    image: postgres:17
    restart: unless-stopped
    shm_size: ${POSTGRES_SHM_SIZE:-256mb}
    container_name: validator-api-db
    environment:
      POSTGRES_DB: ${DB_NAME:-recognition_validator}
      POSTGRES_USER: ${DB_USERNAME:-validator}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-validator}
    command:
      - postgres
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-50}
      - -c
      - max_parallel_workers_per_gather=${POSTGRES_MAX_PARALLEL_WORKERS_PER_GATHER:-0}
    ports:
      - "${POSTGRES_HOST_PORT:-5436}:5432"
    volumes:
      - type: bind
        source: ${POSTGRES_DATA_ROOT_HOST:-./data/postgres}
        target: /var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *default-logging

  validator-api-app:
    restart: unless-stopped
    mem_limit: ${APP_MEMORY_LIMIT:-5g}
    # 0.0 preserves the current unlimited CPU setting; opt in to 2.0 after approval.
    cpus: "${APP_CPU_LIMIT:-0.0}"
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      validator-api-db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://validator-api-db:5432/${DB_NAME:-recognition_validator}
      DB_USERNAME: ${DB_USERNAME:-validator}
      DB_PASSWORD: ${DB_PASSWORD:-validator}
      DB_MAX_POOL_SIZE: ${DB_MAX_POOL_SIZE:-10}
      DB_MIN_IDLE: ${DB_MIN_IDLE:-2}

      VALIDATOR_IMAGE_ROOT: /data/images
      VALIDATOR_BATCH_SIZE: ${VALIDATOR_BATCH_SIZE:-1000}
      VALIDATOR_LEASE_DURATION: ${VALIDATOR_LEASE_DURATION:-30m}
      VALIDATOR_RETENTION: ${VALIDATOR_RETENTION:-4d}
      VALIDATOR_CLEANUP_CRON: "${VALIDATOR_CLEANUP_CRON:-0 0 9 * * *}"
      VALIDATOR_CLEANUP_BATCH_SIZE: ${VALIDATOR_CLEANUP_BATCH_SIZE:-5000}
      VALIDATOR_CLEANUP_MAX_BATCHES: ${VALIDATOR_CLEANUP_MAX_BATCHES:-0}

      VALIDATOR_WATCH_ENABLED: ${VALIDATOR_WATCH_ENABLED:-true}
      VALIDATOR_WATCH_FLUSH_INTERVAL: ${VALIDATOR_WATCH_FLUSH_INTERVAL:-2s}
      VALIDATOR_WATCH_MAX_PENDING_EVENTS: ${VALIDATOR_WATCH_MAX_PENDING_EVENTS:-50000}

      COUNT_REMAINING_SCREENSHOTS: ${COUNT_REMAINING_SCREENSHOTS:-true}

      B2_ENABLED: ${B2_ENABLED:-false}
      B2_ENDPOINT: ${B2_ENDPOINT:-}
      B2_BUCKET: ${B2_BUCKET:-}
      B2_ACCESS_KEY_ID: ${B2_ACCESS_KEY_ID:-}
      B2_SECRET_ACCESS_KEY: ${B2_SECRET_ACCESS_KEY:-}
      B2_OBJECT_PREFIX: ${B2_OBJECT_PREFIX:-validator/}
      B2_UPLOAD_BATCH_SIZE: ${B2_UPLOAD_BATCH_SIZE:-1000}
      B2_UPLOAD_CONCURRENCY: ${B2_UPLOAD_CONCURRENCY:-8}
      B2_UPLOAD_DELAY: ${B2_UPLOAD_DELAY:-10s}
      B2_UPLOAD_RETRY_DELAY: ${B2_UPLOAD_RETRY_DELAY:-5m}
      B2_LOCAL_PREFERRED_AGE: ${B2_LOCAL_PREFERRED_AGE:-3d}
      B2_PRESIGNED_URL_TTL: ${B2_PRESIGNED_URL_TTL:-30m}
      B2_METADATA_RETENTION: ${B2_METADATA_RETENTION:-21d}
      B2_CONNECT_TIMEOUT: ${B2_CONNECT_TIMEOUT:-5s}
      B2_SOCKET_TIMEOUT: ${B2_SOCKET_TIMEOUT:-30s}
      B2_API_CALL_ATTEMPT_TIMEOUT: ${B2_API_CALL_ATTEMPT_TIMEOUT:-45s}
      B2_API_CALL_TIMEOUT: ${B2_API_CALL_TIMEOUT:-2m}
      B2_MAX_ATTEMPTS: ${B2_MAX_ATTEMPTS:-4}

      SLACK_REJECTED_NOTIFICATIONS_ENABLED: ${SLACK_REJECTED_NOTIFICATIONS_ENABLED:-false}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_CHANNEL_ID: ${SLACK_CHANNEL_ID:-}
      SLACK_REJECTED_DETAILS_LIMIT: ${SLACK_REJECTED_DETAILS_LIMIT:-10}
      SLACK_REJECTED_ARCHIVE_URL: ${SLACK_REJECTED_ARCHIVE_URL:-}
      SLACK_CONNECT_TIMEOUT: ${SLACK_CONNECT_TIMEOUT:-2s}
      SLACK_READ_TIMEOUT: ${SLACK_READ_TIMEOUT:-3s}
    ports:
      - "${SERVER_PORT:-18080}:8080"
    volumes:
      - type: bind
        source: ${VALIDATOR_IMAGE_ROOT_HOST:-./data/images}
        target: /data/images
        read_only: true
    logging: *default-logging

  postgres-test:
    image: postgres:17
    shm_size: ${POSTGRES_SHM_SIZE:-256mb}
    profiles: ["test"]
    command:
      - postgres
      - -c
      - max_parallel_workers_per_gather=${POSTGRES_MAX_PARALLEL_WORKERS_PER_GATHER:-0}
    environment:
      POSTGRES_DB: recognition_validator_test
      POSTGRES_USER: validator
      POSTGRES_PASSWORD: validator
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U validator -d recognition_validator_test"]
      interval: 2s
      timeout: 3s
      retries: 15
    logging: *default-logging
