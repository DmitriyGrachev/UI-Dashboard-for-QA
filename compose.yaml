x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:17
    shm_size: ${POSTGRES_SHM_SIZE:-256mb}
    environment:
      POSTGRES_DB: ${DB_NAME:-recognition_validator}
      POSTGRES_USER: ${DB_USERNAME:-validator}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-validator}
    command:
      - postgres
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-50}
      - -c
      - max_parallel_workers_per_gather=${POSTGRES_MAX_PARALLEL_WORKERS_PER_GATHER:-0}
    volumes:
      - type: bind
        source: ${POSTGRES_DATA_ROOT_HOST:-./data/postgres}
        target: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *default-logging

  app:
    image: recognition-validator-app:local
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-recognition_validator}
      DB_USERNAME: ${DB_USERNAME:-validator}
      DB_PASSWORD: ${DB_PASSWORD:-validator}
      DB_MAX_POOL_SIZE: ${DB_MAX_POOL_SIZE:-10}
      VALIDATOR_IMAGE_ROOT: /data/images
      COUNT_REMAINING_SCREENSHOTS: ${COUNT_REMAINING_SCREENSHOTS:-true}
    ports:
      - "127.0.0.1:${SERVER_PORT:-18080}:8080"
    volumes:
      - type: bind
        source: ${VALIDATOR_IMAGE_ROOT_HOST:-./data/images}
        target: /data/images
        read_only: true
    logging: *default-logging

  postgres-test:
    image: postgres:17
    shm_size: ${POSTGRES_SHM_SIZE:-256mb}
    profiles: ["test"]
    command:
      - postgres
      - -c
      - max_parallel_workers_per_gather=${POSTGRES_MAX_PARALLEL_WORKERS_PER_GATHER:-0}
    environment:
      POSTGRES_DB: recognition_validator_test
      POSTGRES_USER: validator
      POSTGRES_PASSWORD: validator
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U validator -d recognition_validator_test"]
      interval: 2s
      timeout: 3s
      retries: 15
    logging: *default-logging
