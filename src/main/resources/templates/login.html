<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="data:,">
    <title>Recognition Validator — Sign in</title>
    <script th:src="@{/js/theme.js}"></script>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="login-page">
<button class="theme-toggle" type="button" data-theme-toggle
        aria-label="Switch to light theme" title="Switch to light theme">
    <span aria-hidden="true" data-theme-icon>☀</span>
    <span data-theme-label>Light</span>
</button>
<main class="login-card">
    <h1>Operator sign in</h1>
    <p class="message" th:if="${param.error}">Invalid username or password.</p>
    <p class="message" th:if="${param.expired}">
        Your session was closed. Sign in again to continue.
    </p>
    <p th:if="${param.logout}">You have been signed out.</p>
    <form method="post" th:action="@{/login}">
        <label>
            Username
            <input name="username" autocomplete="username" required autofocus>
        </label>
        <label>
            Password
            <input name="password" type="password" autocomplete="current-password" required>
        </label>
        <button class="login-submit" type="submit">Sign in</button>
    </form>
</main>
</body>
</html>
