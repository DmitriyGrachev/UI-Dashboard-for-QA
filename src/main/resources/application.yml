spring:
  application:
    name: recognition-validator-app
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/recognition_validator}
    username: ${DB_USERNAME:validator}
    password: ${DB_PASSWORD:validator}
    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:10}
      minimum-idle: ${DB_MIN_IDLE:2}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
server:
  error:
    whitelabel:
      enabled: false
    include-message: never
    include-stacktrace: never
  servlet:
    session:
      timeout: 24h

slack:
  enabled: ${SLACK_REJECTED_NOTIFICATIONS_ENABLED:false}
  bot-token: ${SLACK_BOT_TOKEN:}
  channel-id: ${SLACK_CHANNEL_ID:}
  rejected-details-limit: ${SLACK_REJECTED_DETAILS_LIMIT:10}
  rejected-archive-url: ${SLACK_REJECTED_ARCHIVE_URL:}
  connect-timeout: ${SLACK_CONNECT_TIMEOUT:2s}
  read-timeout: ${SLACK_READ_TIMEOUT:3s}
  api-base-url: ${SLACK_API_BASE_URL:https://slack.com/api}

validator:
  image-root: ${VALIDATOR_IMAGE_ROOT:./data/images}
  batch-size: ${VALIDATOR_BATCH_SIZE:1000}
  lease-duration: ${VALIDATOR_LEASE_DURATION:30m}
  retention: ${VALIDATOR_RETENTION:4d}
  cleanup-cron: "${VALIDATOR_CLEANUP_CRON:0 0 9 * * *}"
  cleanup-batch-size: ${VALIDATOR_CLEANUP_BATCH_SIZE:5000}
  cleanup-max-batches: ${VALIDATOR_CLEANUP_MAX_BATCHES:0}
  watch-enabled: ${VALIDATOR_WATCH_ENABLED:true}
  watch-flush-interval: ${VALIDATOR_WATCH_FLUSH_INTERVAL:2s}
  watch-max-pending-events: ${VALIDATOR_WATCH_MAX_PENDING_EVENTS:50000}
  count-remaining-screenshots: ${COUNT_REMAINING_SCREENSHOTS:true}
  integration:
    image-api-key: ${INTEGRATION_IMAGE_API_KEY:}
  ai-queue:
    lease-duration: ${AI_TASK_LEASE_DURATION:2m}
  ai-delivery:
    public-base-url: ${VALIDATOR_PUBLIC_BASE_URL:}
    signing-key: ${AI_IMAGE_LINK_SIGNING_KEY:}
  b2:
    enabled: ${B2_ENABLED:false}
    endpoint: ${B2_ENDPOINT:}
    bucket: ${B2_BUCKET:}
    access-key-id: ${B2_ACCESS_KEY_ID:}
    secret-access-key: ${B2_SECRET_ACCESS_KEY:}
    object-prefix: ${B2_OBJECT_PREFIX:validator/}
    upload-batch-size: ${B2_UPLOAD_BATCH_SIZE:1000}
    upload-concurrency: ${B2_UPLOAD_CONCURRENCY:8}
    upload-delay: ${B2_UPLOAD_DELAY:10s}
    upload-retry-delay: ${B2_UPLOAD_RETRY_DELAY:5m}
    local-preferred-age: ${B2_LOCAL_PREFERRED_AGE:3d}
    presigned-url-ttl: ${B2_PRESIGNED_URL_TTL:30m}
    metadata-retention: ${B2_METADATA_RETENTION:21d}
    connect-timeout: ${B2_CONNECT_TIMEOUT:5s}
    socket-timeout: ${B2_SOCKET_TIMEOUT:30s}
    api-call-attempt-timeout: ${B2_API_CALL_ATTEMPT_TIMEOUT:45s}
    api-call-timeout: ${B2_API_CALL_TIMEOUT:2m}
    max-attempts: ${B2_MAX_ATTEMPTS:4}
  games:
    - bj_xchange
    - bj_relax
    - bj_igt
    - bj_playtech
    - bj_netent
    - bj_poker_and_pairs
    - bj_first_person
    - bj_black_throne
    - bj_double_deck_black_throne
    - bj_single_deck_ags
    - bj_side_bets_ags
    - bj_americas_ags
    - bj_atlantic_city
    - bj_multihand_play_n_go
