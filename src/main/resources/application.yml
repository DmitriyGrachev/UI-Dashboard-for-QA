spring:
  application:
    name: recognition-validator-app
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/recognition_validator}
    username: ${DB_USERNAME:validator}
    password: ${DB_PASSWORD:validator}
    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:10}
      minimum-idle: ${DB_MIN_IDLE:2}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
server:
  error:
    whitelabel:
      enabled: false
    include-message: never
    include-stacktrace: never
  servlet:
    session:
      timeout: 24h

validator:
  image-root: ${VALIDATOR_IMAGE_ROOT:./data/images}
  batch-size: ${VALIDATOR_BATCH_SIZE:1000}
  lease-duration: ${VALIDATOR_LEASE_DURATION:30m}
  retention: ${VALIDATOR_RETENTION:4d}
  cleanup-cron: "${VALIDATOR_CLEANUP_CRON:0 0 9 * * *}"
  cleanup-batch-size: ${VALIDATOR_CLEANUP_BATCH_SIZE:5000}
  cleanup-max-batches: ${VALIDATOR_CLEANUP_MAX_BATCHES:0}
  watch-enabled: ${VALIDATOR_WATCH_ENABLED:true}
  watch-flush-interval: ${VALIDATOR_WATCH_FLUSH_INTERVAL:2s}
  watch-max-pending-events: ${VALIDATOR_WATCH_MAX_PENDING_EVENTS:50000}
  count-remaining-screenshots: ${COUNT_REMAINING_SCREENSHOTS:true}
  games:
    - bj_xchange
    - bj_relax
    - bj_igt
    - bj_playtech
    - bj_netent
    - bj_poker_and_pairs
    - bj_first_person
    - bj_black_throne
    - bj_double_deck_black_throne
    - bj_single_deck_ags
    - bj_side_bets_ags
    - bj_atlantic_city
    - bj_multihand_play_n_go
